plugins {
    id 'java-library'
    id 'eclipse'
    id 'maven-publish'
    id 'signing'
    id 'org.jreleaser' version '1.18.0'
}
// issue with gradle buildship: https://github.com/eclipse/buildship/issues/939
// --> begin work around
configurations {
    eclipseExtraClasspath.extendsFrom compileOnly
}
eclipse {
    classpath {
        plusConfigurations += [ configurations.eclipseExtraClasspath ]
    }
}
// <-- end work around

java {
    withJavadocJar()
    withSourcesJar()
}

group = 'io.github.brfkar'
//archivesBaseName = "TC.lib"
version = "4.1.0-1"

dependencies {
    compileOnly project(':IEEE1516e')
    api project(':TC.lib.if')
	api libraries.slf4j_api
	implementation libraries.jsonSimple

	testImplementation libraries.slf4j_api
    testImplementation libraries.junit_jupiter_engine
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId='io.github.brfkar'
            artifactId = 'TC.lib'
            from components.java

            pom {
                name = "IVCT Test Case Library"
                description = "Library to be used by IVCT test case developers"
                url = "https://github.com/brfkar/TC.lib"
                licenses {
                    license {
                        name = "The Apache License, Version 2.0"
                        url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }
                developers {
                    developer {
                        id = "brfkar"
                        name = "brfkar"
                        email = "summbarkar@online.de"
                    }
                }
                scm {
                    connection = "scm:git:https://github.com/brfkar/TC.lib.git"
                    developerConnection = "scm:git:https://github.com/brfkar/TC.lib.git"
                    url = "https://github.com/brfkar/TC.lib"
                }
            }
        }
    }
    repositories {
        maven {
            url = layout.buildDirectory.dir('staging-deploy')
            //def releasesRepoUrl = "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
            //def snapshotsRepoUrl = "https://s01.oss.sonatype.org/content/repositories/snapshots/"
            //url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
            //credentials {
            //    username ossrhUsername
            //    password ossrhPassword
            //}
        }
    }
}


/*
signing
{
    sign publishing.publications.mavenJava
}

gradle.taskGraph.whenReady { taskGraph ->
    // Do not sign archives by default (a local build without gpg keyring should succeed)
    if (taskGraph.allTasks.any {  it.name == 'install' || it.name == 'build' || it.name == 'assemble' }) {
        tasks.findAll { it.name == 'signArchives' || it.name == 'signDocsJar' || it.name == 'signTestJar' || it.name == 'signSourcesJar' }.each { task ->
            task.enabled = false
        }
    }
}
*/

jreleaser {
    signing {
        active = 'ALWAYS'
        armored = true
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'ALWAYS'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    snapshotSupported = true
                    sign = true
                    checksums = true
                    verifyPom = true
                    applyMavenCentralRules = true
                    stagingRepository('build/staging-deploy')
                }
            }
        }
    }
}

